name: MuseScore 4 CLI Export

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-export:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb wget libnss3 libasound2 libxkbcommon-x11-0 \
            libegl1 libopengl0 libjack0

      - name: Download MuseScore Studio 4.4.4
        run: |
          wget -O MuseScore.AppImage \
            "https://github.com/musescore/MuseScore/releases/download/v4.4.4/MuseScore-Studio-4.4.4.243461245-x86_64.AppImage"

          chmod +x MuseScore.AppImage
          ./MuseScore.AppImage --appimage-extract

      - name: Export all root .mscx files
        run: |
          mkdir -p exports
          : > export-failures.txt

          export QT_ACCESSIBILITY=0
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          shopt -s nullglob
          files=(./*.mscx)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No .mscx files found in repository root."
            exit 1
          fi

          for file in "${files[@]}"; do
            base="$(basename "$file" .mscx)"
            echo "Exporting: $file"

            echo "PDF..."
            if ! xvfb-run -a ./squashfs-root/bin/mscore4portable \
              -o "exports/${base}.pdf" "$file"; then
              echo "$file -> PDF failed" | tee -a export-failures.txt
            fi

            echo "MP3..."
            if ! xvfb-run -a ./squashfs-root/bin/mscore4portable \
              -o "exports/${base}.mp3" "$file"; then
              echo "$file -> MP3 failed" | tee -a export-failures.txt
            fi
          done

          echo "Generated files:"
          find exports -maxdepth 1 -type f -print

          if [ -s export-failures.txt ]; then
            echo "Some exports failed:"
            cat export-failures.txt
            exit 1
          fi

      - name: Upload Exported Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musescore-exports
          path: |
            exports/
            export-failures.txt
