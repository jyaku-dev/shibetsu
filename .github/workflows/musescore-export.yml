name: MuseScore 4.6.5 Export

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            dbus \
            wget \
            fontconfig \
            libnss3 \
            libasound2 \
            libxkbcommon-x11-0 \
            libegl1 \
            libopengl0 \
            libjack0 \
            fonts-noto-cjk

          mkdir -p ~/.local/share/fonts/klee-one

          wget -O ~/.local/share/fonts/klee-one/KleeOne-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/kleeone/KleeOne-Regular.ttf

          wget -O ~/.local/share/fonts/klee-one/KleeOne-SemiBold.ttf \
            https://github.com/google/fonts/raw/main/ofl/kleeone/KleeOne-SemiBold.ttf

          fc-cache -fv

      - name: Download MuseScore Studio 4.6.5
        run: |
          wget -O MuseScore.AppImage \
            https://github.com/musescore/MuseScore/releases/download/v4.6.5/MuseScore-Studio-4.6.5.253511702-x86_64.AppImage

          chmod +x MuseScore.AppImage
          ./MuseScore.AppImage --appimage-extract

      - name: Show version
        run: |
          dbus-run-session xvfb-run -a -- \
            ./squashfs-root/AppRun --version

      - name: Export all root MSCX files
        run: |
          mkdir -p exports
          : > export-failures.txt

          export HOME="$PWD/muhome"
          mkdir -p "$HOME"

          export QT_ACCESSIBILITY=0

          export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          shopt -s nullglob
          files=(./*.mscx)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No .mscx files found."
            exit 1
          fi

          for file in "${files[@]}"; do
            base="$(basename "$file" .mscx)"

            echo "Exporting $file"

            if ! dbus-run-session xvfb-run -a -- \
              ./squashfs-root/AppRun \
              -F -f \
              -o "exports/${base}.pdf" \
              "$file"; then
              echo "$file -> PDF failed" | tee -a export-failures.txt
            fi

            if ! dbus-run-session xvfb-run -a -- \
              ./squashfs-root/AppRun \
              -F -f \
              --sound-profile "MuseScore Basic" \
              -o "exports/${base}.mp3" \
              "$file"; then
              echo "$file -> MP3 failed" | tee -a export-failures.txt
            fi
          done

          echo "Generated files:"
          find exports -type f

          if [ -s export-failures.txt ]; then
            echo
            echo "Failures:"
            cat export-failures.txt
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musescore-exports
          path: |
            exports/
            export-failures.txt
