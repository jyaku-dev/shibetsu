name: MuseScore 4 CLI Export

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-export:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb wget fontconfig libnss3 libasound2 libxkbcommon-x11-0 \
            libegl1 libopengl0 libjack0 fonts-noto-cjk

          mkdir -p ~/.local/share/fonts/klee-one
          wget -O ~/.local/share/fonts/klee-one/KleeOne-Regular.ttf \
            "https://github.com/google/fonts/raw/main/ofl/kleeone/KleeOne-Regular.ttf"
          wget -O ~/.local/share/fonts/klee-one/KleeOne-SemiBold.ttf \
            "https://github.com/google/fonts/raw/main/ofl/kleeone/KleeOne-SemiBold.ttf"
          fc-cache -fv
          fc-match "Klee One"

      - name: Download MuseScore Studio 4.4.4
        run: |
          wget -O MuseScore.AppImage \
            "https://github.com/musescore/MuseScore/releases/download/v4.4.4/MuseScore-Studio-4.4.4.243461245-x86_64.AppImage"

          chmod +x MuseScore.AppImage
          ./MuseScore.AppImage --appimage-extract

      - name: Export all root .mscx files
        run: |
          mkdir -p exports jobs muhome
          : > export-failures.txt

          export HOME="$PWD/muhome"
          export QT_ACCESSIBILITY=0
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          MSCORE="./squashfs-root/bin/mscore4portable"

          echo "MuseScore version:"
          xvfb-run -a "$MSCORE" --version || true

          shopt -s nullglob
          files=(./*.mscx)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No .mscx files found in repository root."
            exit 1
          fi

          for file in "${files[@]}"; do
            base="$(basename "$file" .mscx)"
            job="jobs/${base}.json"

            echo "Creating job for: $file"

            cat > "$job" <<EOF
          [
            {
              "in": "$file",
              "out": [
                "exports/${base}.pdf",
                "exports/${base}.mp3"
              ]
            }
          ]
          EOF

            echo "Job file:"
            cat "$job"

            set +e
            xvfb-run -a "$MSCORE" -F -f -j "$job"
            code=$?
            set -e

            echo "Job exit code: $code"
            ls -lah exports || true

            if [ "$code" -ne 0 ]; then
              echo "$file -> job failed, exit code $code" | tee -a export-failures.txt
            fi

            if [ ! -s "exports/${base}.pdf" ]; then
              echo "$file -> PDF missing" | tee -a export-failures.txt
            fi

            if [ ! -s "exports/${base}.mp3" ]; then
              echo "$file -> MP3 missing" | tee -a export-failures.txt
            fi
          done

          echo "Generated files:"
          find exports -maxdepth 1 -type f -print || true

          if [ -s export-failures.txt ]; then
            echo "Some exports failed:"
            cat export-failures.txt
            exit 1
          fi

      - name: Upload Exported Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musescore-exports
          path: |
            exports/
            jobs/
            export-failures.txt
